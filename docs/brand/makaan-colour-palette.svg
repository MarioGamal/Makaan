<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">Makaan colour palette</title>
  <desc id="desc">Designer handoff showing Makaan core brand colours, interface neutrals, and UI-only status colours.</desc>
  <rect width="1600" height="1260" fill="#F7F4EE"/>

  <g font-family="Inter, Arial, sans-serif" fill="#192A25">
    <text x="80" y="105" font-size="58" font-weight="600" letter-spacing="-1.5">Makaan colour palette</text>
    <text x="80" y="151" font-size="22" fill="#53615C">Logo and digital-brand handoff · مكان</text>

    <rect x="80" y="198" width="1440" height="102" rx="28" fill="#125C4E"/>
    <text x="120" y="242" font-size="17" font-weight="600" fill="#DCECE5" letter-spacing="1.6">RECOMMENDED LOGO COMBINATION</text>
    <text x="120" y="276" font-size="25" font-weight="500" fill="#FFFFFF">Forest Green + Deep Ink · Reverse in white on dark green</text>

    <text x="80" y="365" font-size="26" font-weight="600">Core brand palette</text>
    <text x="80" y="397" font-size="17" fill="#53615C">These colours may be used in the logo system.</text>

    <g transform="translate(80 430)">
      <rect width="440" height="210" rx="26" fill="#FFFFFF"/>
      <path d="M26 0h388a26 26 0 0 1 26 26v98H0V26A26 26 0 0 1 26 0Z" fill="#125C4E"/>
      <text x="24" y="158" font-size="23" font-weight="600">Forest Green</text>
      <text x="24" y="188" font-size="17" fill="#53615C">#125C4E · RGB 18, 92, 78 · Primary</text>
    </g>
    <g transform="translate(580 430)">
      <rect width="440" height="210" rx="26" fill="#FFFFFF"/>
      <path d="M26 0h388a26 26 0 0 1 26 26v98H0V26A26 26 0 0 1 26 0Z" fill="#0B463B"/>
      <text x="24" y="158" font-size="23" font-weight="600">Deep Green</text>
      <text x="24" y="188" font-size="17" fill="#53615C">#0B463B · RGB 11, 70, 59 · Dark variant</text>
    </g>
    <g transform="translate(1080 430)">
      <rect width="440" height="210" rx="26" fill="#FFFFFF"/>
      <path d="M26 0h388a26 26 0 0 1 26 26v98H0V26A26 26 0 0 1 26 0Z" fill="#192A25"/>
      <text x="24" y="158" font-size="23" font-weight="600">Deep Ink</text>
      <text x="24" y="188" font-size="17" fill="#53615C">#192A25 · RGB 25, 42, 37 · Wordmark</text>
    </g>

    <g transform="translate(80 670)">
      <rect width="440" height="210" rx="26" fill="#FFFFFF"/>
      <path d="M26 0h388a26 26 0 0 1 26 26v98H0V26A26 26 0 0 1 26 0Z" fill="#DCECE5"/>
      <text x="24" y="158" font-size="23" font-weight="600">Soft Sage</text>
      <text x="24" y="188" font-size="17" fill="#53615C">#DCECE5 · RGB 220, 236, 229 · Tint</text>
    </g>
    <g transform="translate(580 670)">
      <rect width="440" height="210" rx="26" fill="#FFFFFF"/>
      <path d="M26 0h388a26 26 0 0 1 26 26v98H0V26A26 26 0 0 1 26 0Z" fill="#F7F4EE" stroke="#D7D1C5"/>
      <text x="24" y="158" font-size="23" font-weight="600">Warm Canvas</text>
      <text x="24" y="188" font-size="17" fill="#53615C">#F7F4EE · RGB 247, 244, 238 · Neutral</text>
    </g>
    <g transform="translate(1080 670)">
      <rect width="440" height="210" rx="26" fill="#FFFFFF"/>
      <path d="M26 0h388a26 26 0 0 1 26 26v98H0V26A26 26 0 0 1 26 0Z" fill="#B8643B"/>
      <text x="24" y="158" font-size="23" font-weight="600">Terracotta</text>
      <text x="24" y="188" font-size="17" fill="#53615C">#B8643B · RGB 184, 100, 59 · Accent only</text>
    </g>

    <text x="80" y="955" font-size="26" font-weight="600">Interface neutrals</text>
    <text x="80" y="987" font-size="17" fill="#53615C">Website support colours; not required in the logo.</text>
    <g transform="translate(80 1020)">
      <rect width="335" height="115" rx="22" fill="#FFFDF8" stroke="#D7D1C5"/>
      <circle cx="45" cy="42" r="20" fill="#FFFDF8" stroke="#D7D1C5"/>
      <text x="78" y="38" font-size="19" font-weight="600">Warm Surface</text>
      <text x="78" y="65" font-size="16" fill="#53615C">#FFFDF8</text>
    </g>
    <g transform="translate(448 1020)">
      <rect width="335" height="115" rx="22" fill="#FFFFFF"/>
      <circle cx="45" cy="42" r="20" fill="#EEE8DC"/>
      <text x="78" y="38" font-size="19" font-weight="600">Muted Sand</text>
      <text x="78" y="65" font-size="16" fill="#53615C">#EEE8DC</text>
    </g>
    <g transform="translate(816 1020)">
      <rect width="335" height="115" rx="22" fill="#FFFFFF"/>
      <circle cx="45" cy="42" r="20" fill="#53615C"/>
      <text x="78" y="38" font-size="19" font-weight="600">Muted Ink</text>
      <text x="78" y="65" font-size="16" fill="#53615C">#53615C</text>
    </g>
    <g transform="translate(1185 1020)">
      <rect width="335" height="115" rx="22" fill="#FFFFFF"/>
      <circle cx="45" cy="42" r="20" fill="#D7D1C5"/>
      <text x="78" y="38" font-size="19" font-weight="600">Warm Border</text>
      <text x="78" y="65" font-size="16" fill="#53615C">#D7D1C5</text>
    </g>

    <text x="80" y="1202" font-size="16" fill="#53615C">UI status colours — Success #1C7658 · Warning #A46016 · Danger #AE3E32 — are functional and should stay outside the logo palette.</text>
  </g>
</svg>
